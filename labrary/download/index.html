<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Labrary | Download</title>

  <meta
    name="description"
    content="Labrary - 기록하고, 도전하고, 성장하는 독서 습관 앱."
  />

  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #777777;
      --line: #e9e9e9;
      --soft: #f7f7f5;
      --green: #113f36;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================
       Layout
       ========================================= */

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: min(1080px, calc(100% - 48px));
      margin: 0 auto;
    }

    /* =========================================
       Header
       ========================================= */

    .header {
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 30px;

      font-size: 14px;
      color: #555555;
    }

    .nav a {
      transition: opacity 0.15s ease;
    }

    .nav a:hover {
      opacity: 0.55;
    }

    /* =========================================
       Main
       ========================================= */

    .main {
      flex: 1;
    }

    .hero {
      max-width: 720px;

      margin: 0 auto;
      padding: 90px 0 96px;

      text-align: center;
    }

    .app-icon {
      display: block;

      width: 92px;
      height: 92px;

      margin: 0 auto 26px;

      border-radius: 22px;
      object-fit: cover;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .overline {
      margin: 0 0 18px;

      color: #777777;

      font-size: 13px;
      font-weight: 600;

      letter-spacing: 0.05em;
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 6vw, 66px);
      line-height: 1.04;

      letter-spacing: -0.055em;
      font-weight: 700;
    }

    .description {
      margin: 24px auto 0;

      color: #666666;

      font-size: 17px;
      line-height: 1.7;

      letter-spacing: -0.01em;
    }

    /* =========================================
       Download
       ========================================= */

    .download-section {
      width: min(520px, 100%);

      margin: 54px auto 0;

      text-align: left;
    }

    .download-label {
      margin-bottom: 14px;

      color: #999999;

      font-size: 12px;
      font-weight: 650;

      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .store-link {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 88px;

      padding: 18px 20px;

      border-top: 1px solid var(--line);

      transition:
        background 0.16s ease,
        padding 0.16s ease;
    }

    .store-link:last-of-type {
      border-bottom: 1px solid var(--line);
    }

    .store-link:hover {
      background: var(--soft);
      padding-left: 24px;
      padding-right: 24px;
    }

    .store-left {
      display: flex;
      align-items: center;

      gap: 16px;
    }

    .store-symbol {
      width: 34px;

      flex-shrink: 0;

      color: var(--green);

      font-size: 28px;
      text-align: center;
    }

    .store-name {
      display: block;

      margin-bottom: 4px;

      font-size: 17px;
      font-weight: 650;

      letter-spacing: -0.02em;
    }

    .store-copy {
      display: block;

      color: #888888;

      font-size: 13px;
    }

    .arrow {
      color: #777777;

      font-size: 20px;

      transition: transform 0.15s ease;
    }

    .store-link:hover .arrow {
      transform: translateX(3px);
    }

    /* =========================================
       Small note
       ========================================= */

    .note {
      margin-top: 24px;

      color: #999999;

      font-size: 12px;
      line-height: 1.6;

      text-align: center;
    }

    /* =========================================
       Footer
       ========================================= */

    .footer {
      border-top: 1px solid var(--line);
    }

    .footer-inner {
      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;

      color: #999999;

      font-size: 12px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .footer a:hover {
      color: #333333;
    }

    /* =========================================
       Mobile
       ========================================= */

    @media (max-width: 640px) {

      .container {
        width: min(100% - 32px, 520px);
      }

      .header-inner {
        height: 62px;
      }

      .nav {
        gap: 18px;
        font-size: 13px;
      }

      .nav .hide-mobile {
        display: none;
      }

      .hero {
        padding: 58px 0 62px;
      }

      .app-icon {
        width: 82px;
        height: 82px;

        margin-bottom: 24px;

        border-radius: 20px;
      }

      .overline {
        margin-bottom: 14px;

        font-size: 12px;
      }

      h1 {
        font-size: 44px;
      }

      .description {
        margin-top: 20px;

        font-size: 16px;
        line-height: 1.65;
      }

      .download-section {
        margin-top: 42px;
      }

      .store-link {
        min-height: 82px;

        padding-left: 8px;
        padding-right: 8px;
      }

      .store-link:hover {
        padding-left: 8px;
        padding-right: 8px;
      }

      .store-name {
        font-size: 16px;
      }

      .store-copy {
        font-size: 12px;
      }

      .footer-inner {
        min-height: 82px;

        flex-direction: column;
        align-items: flex-start;
        justify-content: center;

        gap: 8px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- Header -->

    <header class="header">
      <div class="container header-inner">

        <a
          href="https://viixi.kr/"
          class="brand"
        >
          VIIXI Labs
        </a>

        <nav class="nav">
          <a
            href="https://viixi.kr/"
            class="hide-mobile"
          >
            Home
          </a>

          <a href="https://viixi.kr/labrary/">
            Labrary
          </a>
        </nav>

      </div>
    </header>


    <!-- Main -->

    <main class="main">
      <div class="container">

        <section class="hero">

          <img
            src="../../assets/labrary-icon.png"
            alt="Labrary app icon"
            class="app-icon"
          />

          <p class="overline">
            Labrary by VIIXI Labs
          </p>

          <h1>
            Read. Challenge. Grow.
          </h1>

          <p class="description">
            기록하고, 도전하고, 성장하는 독서 습관 앱입니다.
          </p>


          <!-- Download -->

          <div class="download-section">

            <div class="download-label">
              Download
            </div>


            <!-- App Store -->

            <a
              class="store-link"
              href="https://apps.apple.com/kr/app/labrary-%EB%8F%85%EC%84%9C-%EA%B8%B0%EB%A1%9D-%EC%B1%8C%EB%A6%B0%EC%A7%80/id6758513187"
              target="_blank"
              rel="noopener noreferrer"
            >

              <div class="store-left">

                <div class="store-symbol">
                  
                </div>

                <div>
                  <span class="store-name">
                    App Store
                  </span>

                  <span class="store-copy">
                    iPhone에서 Labrary를 다운로드하세요.
                  </span>
                </div>

              </div>

              <span class="arrow">
                →
              </span>

            </a>


            <!-- Google Play -->

            <a
              class="store-link"
              href="https://play.google.com/store/apps/details?id=com.la_pharos.labrary"
              target="_blank"
              rel="noopener noreferrer"
            >

              <div class="store-left">

                <div class="store-symbol">
                  ▶
                </div>

                <div>
                  <span class="store-name">
                    Google Play
                  </span>

                  <span class="store-copy">
                    Android에서 Labrary를 다운로드하세요.
                  </span>
                </div>

              </div>

              <span class="arrow">
                →
              </span>

            </a>

          </div>


          <p class="note">
            iOS · Android
          </p>

        </section>

      </div>
    </main>


    <!-- Footer -->

    <footer class="footer">
      <div class="container footer-inner">

        <span>
          © VIIXI Labs. All rights reserved.
        </span>

        <div class="footer-links">

          <a href="https://viixi.kr/labrary/privacy/">
            Privacy
          </a>

          <a href="https://viixi.kr/labrary/terms/">
            Terms
          </a>

        </div>

      </div>
    </footer>

  </div>

</body>
</html>
